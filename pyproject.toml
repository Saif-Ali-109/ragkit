[project]
name = "ragkit"
version = "0.3.0"
description = "Reusable RAG framework extracted from DocPilot — Stage 3: core chain + agentic layer + eval harness"
readme = "README.md"
authors = [
    { name = "Saif-Ali-109", email = "01-134242-109@student.bahria.edu.pk" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.14.0+cpu",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.10.0",
    "requests>=2.32.0",
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# --- CPU-only torch (no CUDA toolkit) ---
# BGE-small inference runs on CPU; forcing the PyTorch CPU index avoids
# pulling ~2.5GB of nvidia-* CUDA packages into the venv.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }